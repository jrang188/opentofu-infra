repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
        args:
          - --hook-config=--tf-path=tofu

      - id: terraform_validate
        args:
          - --hook-config=--tf-path=tofu
          - --hook-config=--retry-once-with-cleanup=true

      # Requires tflint on PATH — not installed by this hook. See README.
      - id: terraform_tflint

      # Requires trivy on PATH — not installed by this hook. See README.
      # trivy conf scans the whole directory, not just our .tf files, so
      # without --skip-dirs it also flags the downloaded copy of the
      # kube-hetzner module's Kubernetes manifests under .terraform/ — code
      # we don't own and can't fix, gitignored but present on disk post-init.
      - id: terraform_trivy
        args:
          - --args=--skip-dirs=**/.terraform
